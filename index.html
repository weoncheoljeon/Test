<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나만의 칼라풀 환율 계산기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a1c29 0%, #0e1017 100%);
      padding: 20px;
    }

    /* 계산기 본체 */
    .calculator {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                  inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(90deg, #ff758c 0%, #ff7eb3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    /* 디스플레이 및 입력 영역 */
    .display-container {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .currency-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .currency-row:last-child {
      margin-bottom: 0;
    }

    select {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      outline: none;
      box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
    }

    select option {
      background: #2d3436;
      color: white;
    }

    .amount-input {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 700;
      text-align: right;
      width: 60%;
      outline: none;
    }

    .amount-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    /* 통화 전환 버튼 */
    .swap-btn-container {
      display: flex;
      justify-content: center;
      margin: -10px 0;
      position: relative;
      z-index: 2;
    }

    .swap-btn {
      background: linear-gradient(135deg, #00b894, #00cec9);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(0, 206, 201, 0.4);
      transition: transform 0.2s;
    }

    .swap-btn:hover {
      transform: rotate(180deg) scale(1.1);
    }

    /* 키패드 버튼 그리드 */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .btn {
      aspect-ratio: 1;
      border: none;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* 숫자 버튼 */
    .btn-num {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .btn-num:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* 지우기/초기화 버튼 */
    .btn-action {
      background: linear-gradient(135deg, #ff7675, #d63031);
      color: white;
    }

    /* 00 버튼 */
    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      color: #fdcb6e;
    }

    .status-info {
      text-align: center;
      margin-top: 16px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="header">
      <h1>EXCHANGE CALCULATOR</h1>
    </div>

    <div class="display-container">
      <!-- 보낼 금액 -->
      <div class="currency-row">
        <select id="fromCurrency" onchange="convertCurrency()">
          <option value="KRW" selected>KRW (원)</option>
          <option value="USD">USD ($)</option>
          <option value="JPY">JPY (¥)</option>
          <option value="EUR">EUR (€)</option>
          <option value="CNY">CNY (¥)</option>
        </select>
        <input type="text" id="fromAmount" class="amount-input" value="1,000" readonly />
      </div>

      <!-- 전환 위치 반전 버튼 -->
      <div class="swap-btn-container">
        <button class="swap-btn" onclick="swapCurrencies()">⇅</button>
      </div>

      <!-- 받을 금액 -->
      <div class="currency-row">
        <select id="toCurrency" onchange="convertCurrency()">
          <option value="KRW">KRW (원)</option>
          <option value="USD" selected>USD ($)</option>
          <option value="JPY">JPY (¥)</option>
          <option value="EUR">EUR (€)</option>
          <option value="CNY">CNY (¥)</option>
        </select>
        <input type="text" id="toAmount" class="amount-input" value="0" readonly />
      </div>
    </div>

    <!-- 계산기 키패드 -->
    <div class="keypad">
      <button class="btn btn-action" onclick="clearInput()">C</button>
      <button class="btn btn-action" onclick="deleteLast()">⌫</button>
      <button class="btn btn-secondary" onclick="appendInput('00')">00</button>
      <button class="btn btn-secondary" onclick="appendInput('.')">.</button>

      <button class="btn btn-num" onclick="appendInput('7')">7</button>
      <button class="btn btn-num" onclick="appendInput('8')">8</button>
      <button class="btn btn-num" onclick="appendInput('9')">9</button>
      <button class="btn btn-num" style="visibility: hidden;"></button>

      <button class="btn btn-num" onclick="appendInput('4')">4</button>
      <button class="btn btn-num" onclick="appendInput('5')">5</button>
      <button class="btn btn-num" onclick="appendInput('6')">6</button>
      <button class="btn btn-num" style="visibility: hidden;"></button>

      <button class="btn btn-num" onclick="appendInput('1')">1</button>
      <button class="btn btn-num" onclick="appendInput('2')">2</button>
      <button class="btn btn-num" onclick="appendInput('3')">3</button>
      <button class="btn btn-num" style="visibility: hidden;"></button>

      <button class="btn btn-num" style="grid-column: span 3; aspect-ratio: auto;" onclick="appendInput('0')">0</button>
    </div>

    <div class="status-info" id="rateInfo">
      실시간 환율 정보를 불러오는 중...
    </div>
  </div>

  <script>
    let rawAmount = "1000";
    let rates = {};

    // 실시간 환율 API 호출 (무료 Open API)
    async function fetchRates() {
      try {
        const response = await fetch("https://open.er-api.com/v6/latest/USD");
        const data = await response.json();
        rates = data.rates;
        document.getElementById("rateInfo").innerText = "무료 Open API 기준 실시간 환율 적용 중";
        convertCurrency();
      } catch (error) {
        document.getElementById("rateInfo").innerText = "환율 정보를 불러올 수 없습니다.";
      }
    }

    // 숫자 및 기호 입력
    function appendInput(val) {
      if (rawAmount === "0" && val !== ".") {
        rawAmount = val;
      } else {
        if (val === "." && rawAmount.includes(".")) return;
        rawAmount += val;
      }
      updateDisplay();
    }

    // 전체 삭제 (C)
    function clearInput() {
      rawAmount = "0";
      updateDisplay();
    }

    // 한 글자 삭제 (Backspace)
    function deleteLast() {
      rawAmount = rawAmount.slice(0, -1);
      if (rawAmount === "" || rawAmount === "-") rawAmount = "0";
      updateDisplay();
    }

    // 화면 입력값 콤마(,) 포맷팅
    function updateDisplay() {
      const parts = rawAmount.split(".");
      parts[0] = Number(parts[0]).toLocaleString();
      document.getElementById("fromAmount").value = parts.join(".");
      convertCurrency();
    }

    // 환율 계산 수행
    function convertCurrency() {
      if (!rates || Object.keys(rates).length === 0) return;

      const from = document.getElementById("fromCurrency").value;
      const to = document.getElementById("toCurrency").value;
      const numValue = parseFloat(rawAmount) || 0;

      // 기준 통화(USD) 기반 변환
      const inUSD = numValue / rates[from];
      const converted = inUSD * rates[to];

      document.getElementById("toAmount").value = converted.toLocaleString(undefined, {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });
    }

    // 통화 위치 변경
    function swapCurrencies() {
      const fromSelect = document.getElementById("fromCurrency");
      const toSelect = document.getElementById("toCurrency");

      const temp = fromSelect.value;
      fromSelect.value = toSelect.value;
      toSelect.value = temp;

      convertCurrency();
    }

    // 초기화
    fetchRates();
  </script>
</body>
</html>
